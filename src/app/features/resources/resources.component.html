<div class="page">
  <div class="page-header">
    <h1>Resources</h1>
    <button class="btn-print" onclick="window.print()">Print</button>
  </div>

  <!-- DOCUMENTS -->
  <section class="section">
    <h2 class="section-title">Documents</h2>
    <div class="doc-list">
      @if (svc.pdfUrl()) {
        <a [href]="svc.pdfUrl()" target="_blank" rel="noopener" class="doc-card">
          <span class="doc-icon">📄</span>
          <div class="doc-info">
            <div class="doc-name">TCC Children's & Youth Ministries</div>
            <div class="doc-sub">Policies and Procedures — Updated Feb 2018</div>
          </div>
          <span class="doc-action">Open PDF</span>
        </a>
        @if (editMode()) {
          <button class="btn-set-pdf" (click)="promptPdfUrl()">Change PDF Link</button>
        }
      } @else {
        <div class="doc-card doc-card-empty">
          <span class="doc-icon">📄</span>
          <div class="doc-info">
            <div class="doc-name">TCC Children's & Youth Ministries</div>
            <div class="doc-sub">No PDF link set yet</div>
          </div>
          <button class="btn-set-pdf" (click)="promptPdfUrl()">Set PDF Link</button>
        </div>
      }
    </div>
  </section>

</div>
